[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optionpricing"
version = "0.1.0"
description = "European option pricing with PDE finite differences and Monte Carlo simulation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Oliver"}]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "jupyter",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

